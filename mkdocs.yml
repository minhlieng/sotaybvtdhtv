  - 2. Điều trị Nội trú: noitru.md
  - 3. Tiện ích:
      3.1 Phần mềm scan: 3.1.phanmemscan.md 
      3.2 Làm mới phần mềm KCB: 3.2.lammoiphanmem.md 
