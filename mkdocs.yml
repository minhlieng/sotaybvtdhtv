site_name: "HƯỚNG DẪN KHÁM BỆNH, CHỮA BỆNH EMR"
theme:
  name: material
  language: vi
  palette:
    - scheme: default
      primary: blue        # màu chủ đạo
      accent: teal         # màu nhấn
    - scheme: slate        # chế độ dark mode
      primary: blue
      accent: teal
      toggle:
        icon: material/weather-night
  font:
    text: Roboto
    code: Fira Code
